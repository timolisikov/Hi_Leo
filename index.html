<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hi Leo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #101010;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: #ffffff;
      color: #101010;
      overflow-x: hidden;
    }

    .screen {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: 32px;
      text-align: center;
    }

    .content {
      display: grid;
      justify-items: center;
      gap: 28px;
      width: min(980px, 100%);
    }

    h1 {
      margin: 0;
      font-size: 5rem;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: 0;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }

    .intro {
      max-width: 13ch;
    }

    button {
      min-width: 170px;
      min-height: 54px;
      border: 2px solid #101010;
      border-radius: 8px;
      padding: 0 24px;
      background: #101010;
      color: #ffffff;
      font: 700 1.05rem/1 Arial, Helvetica, sans-serif;
      letter-spacing: 0;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, color 120ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #ffffff;
      color: #101010;
    }

    button:active {
      transform: translateY(0);
    }

    .final-view {
      display: none;
      justify-items: center;
      gap: 28px;
      width: min(980px, 100%);
    }

    .final-message {
      margin: 0;
      width: min(100%, 18ch);
      font-size: 4rem;
      line-height: 1.08;
    }

    body.finished .intro,
    body.finished .action {
      display: none;
    }

    body.finished .final-view {
      display: grid;
    }

    .scare-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      overflow: hidden;
      background: #030303;
    }

    body.scared {
      overflow: hidden;
    }

    body.scared .screen {
      display: none;
    }

    body.scared .scare-overlay {
      display: grid;
    }

    .scare-image {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
      filter: contrast(1.25) saturate(1.15);
      transform-origin: center;
    }

    body.scared .scare-image {
      animation: jump-in 850ms cubic-bezier(0.05, 0.95, 0.12, 1) forwards,
        scare-shake 65ms 850ms 12 steps(2);
    }

    .image-credit {
      position: fixed;
      right: 10px;
      bottom: 8px;
      z-index: 11;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.72rem;
      text-decoration: none;
    }

    .image-credit:hover {
      color: #ffffff;
    }

    @keyframes jump-in {
      0% {
        opacity: 0;
        transform: scale(0.12) rotate(-7deg);
      }

      42% {
        opacity: 1;
        transform: scale(1.24) rotate(4deg);
      }

      62% {
        transform: scale(1.08) rotate(-2deg);
      }

      100% {
        opacity: 1;
        transform: scale(1.12) rotate(0deg);
      }
    }

    @keyframes scare-shake {
      0% { transform: translate(-12px, 8px) scale(1.12); }
      50% { transform: translate(14px, -9px) scale(1.16); }
      100% { transform: translate(-8px, -12px) scale(1.14); }
    }

    @media (max-width: 900px) {
      h1 {
        font-size: 3.6rem;
      }

      .final-message {
        font-size: 3rem;
      }
    }

    @media (max-width: 640px) {
      .screen {
        padding: 24px 18px;
      }

      .content {
        gap: 22px;
      }

      .final-view {
        gap: 20px;
      }

      h1 {
        font-size: 2.5rem;
        line-height: 1.08;
      }

      .final-message {
        width: min(100%, 12ch);
        font-size: 1.75rem;
        line-height: 1.12;
      }

      button {
        width: min(100%, 240px);
        min-height: 52px;
      }

      .image-credit {
        left: 8px;
        right: 8px;
        bottom: 6px;
        font-size: 0.62rem;
        text-align: right;
      }
    }

    @media (max-width: 380px) {
      h1 {
        font-size: 2.1rem;
      }

      .final-message {
        width: min(100%, 11ch);
        font-size: 1.45rem;
      }

      button {
        min-height: 50px;
      }
    }

    @media (max-height: 520px) {
      .screen {
        padding: 16px;
      }

      .content,
      .final-view {
        gap: 14px;
      }

      h1 {
        font-size: 2rem;
        line-height: 1.08;
      }

      .final-message {
        font-size: 1.6rem;
        line-height: 1.12;
      }

      button {
        min-height: 46px;
      }
    }
  </style>
</head>
<body>
  <main class="screen" aria-live="polite">
    <section class="content">
      <h1 class="intro">Hi Leo das hier ist nur ein beispiel</h1>
      <button class="action" type="button">drück mich</button>
      <div class="final-view">
        <h1 class="final-message">Leo bitte nimm mich ins Team auf Ich habe anfrage auf Whatsapp gestellt</h1>
        <button class="final-action" type="button">drück mich</button>
      </div>
    </section>
  </main>

  <aside class="scare-overlay" aria-hidden="true">
    <img
      class="scare-image"
      src="https://upload.wikimedia.org/wikipedia/commons/c/c4/Pennywise_Cosplay_4.jpg"
      alt=""
    >
    <a
      class="image-credit"
      href="https://commons.wikimedia.org/wiki/File:Pennywise_Cosplay_4.jpg"
      rel="noopener"
    >Bild: Pikawil, CC BY-SA 2.0</a>
  </aside>

  <script>
    const button = document.querySelector(".action");
    const finalButton = document.querySelector(".final-action");

    button.addEventListener("click", () => {
      document.body.classList.add("finished");
    });

    finalButton.addEventListener("click", () => {
      document.body.classList.add("scared");
    });
  </script>
</body>
</html>
