<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hi Leo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #101010;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: #ffffff;
      color: #101010;
    }

    .screen {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 32px;
      text-align: center;
    }

    .content {
      display: grid;
      justify-items: center;
      gap: 28px;
      width: min(980px, 100%);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 8vw, 5.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: 0;
      text-wrap: balance;
    }

    button {
      min-width: 170px;
      min-height: 54px;
      border: 2px solid #101010;
      border-radius: 8px;
      padding: 0 24px;
      background: #101010;
      color: #ffffff;
      font: 700 1.05rem/1 Arial, Helvetica, sans-serif;
      letter-spacing: 0;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, color 120ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #ffffff;
      color: #101010;
    }

    button:active {
      transform: translateY(0);
    }

    .final-message {
      display: none;
      font-size: clamp(2.1rem, 7vw, 5rem);
      line-height: 1.08;
    }

    body.finished .intro,
    body.finished .action {
      display: none;
    }

    body.finished .final-message {
      display: block;
    }

    @media (max-width: 520px) {
      .screen {
        padding: 22px;
      }

      .content {
        gap: 22px;
      }

      button {
        width: min(100%, 220px);
      }
    }
  </style>
</head>
<body>
  <main class="screen" aria-live="polite">
    <section class="content">
      <h1 class="intro">Hi Leo das hier ist nur ein beispiel</h1>
      <button class="action" type="button">drück mich</button>
      <h1 class="final-message">Leo bitte nimm mich ins Team auf Ich habe anfrage auf Whatsapp gestellt</h1>
    </section>
  </main>

  <script>
    const button = document.querySelector(".action");

    button.addEventListener("click", () => {
      document.body.classList.add("finished");
    });
  </script>
</body>
</html>
